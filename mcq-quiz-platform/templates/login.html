{% extends "base.html" %}
{% block title %}Login - MCQ Arena{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card tilt-card">
        <h1 class="login-title">Welcome <span class="gradient-text">Back</span></h1>
        <p class="login-sub">Enter the arena and prove your knowledge</p>

        <form method="POST" class="login-form" autocomplete="off">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required autofocus>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-primary btn-3d">Enter Arena →</button>
        </form>

        <p class="login-hint">Default admin: <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
</div>
{% endblock %}
